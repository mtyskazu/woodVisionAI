[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "woodvisionai"
version = "0.1.0"
description = "高精度エッジAI木材検品・座標出力システム"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1",
    "torchvision>=0.16",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
woodvisionai-capture = "woodvisionai.camera.capture:main"
woodvisionai-lighting = "tools.lighting_comparison:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
